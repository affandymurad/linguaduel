name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install & test server
        working-directory: server
        run: npm ci && npm test

      - name: Install & test client
        working-directory: client
        run: npm ci && npm test

      - name: Build client
        working-directory: client
        run: npm run build

      # Fungsi dibundle oleh Netlify CLI (membaca netlify.toml).
      # LLM_API_KEY dll. diset di Netlify dashboard → Site settings → Environment variables.
      - name: Deploy to Netlify
        run: npx --yes netlify-cli@latest deploy --prod --dir=client/dist --functions=netlify/functions
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
